[project]
name = "cwm-iac"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.5.1",
    "prometheus-client>=0.26.0",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project.scripts]
cwm-iac = "cwm_iac.cli:main"
