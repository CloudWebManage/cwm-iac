apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cwm
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: cwm
    major: {{ .Values.postgresMajor }}
  instances: 1
  storage:
    size: 10Gi
  enableSuperuserAccess: true
  superuserSecret:
    name: cwm-postgres-superuser
  affinity:
    tolerations:
      - key: cwm-iac-worker-role
        operator: Equal
        value: system
        effect: NoExecute
  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: cwm
spec:
  images:
    # Debian Bookworm entries from the upstream CloudNativePG image catalog.
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.12-202611201711-system-bookworm@sha256:7bfe2e96f4592b1dcfa8669810f571192b860b99732ba552e8abd34824af5927
    - major: 19
      image: ghcr.io/cloudnative-pg/postgresql:19.0-202611201710-system-bookworm@sha256:554422fb2a436802e908a75248b1fad1de3499dd75c0464a06f0514603695f36
