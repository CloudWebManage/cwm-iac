{{- include "tierer.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tierer-server
spec:
  selector:
    matchLabels:
      app: tierer-server
  replicas: 1
  # The durable cursor is not a leader lock. Never overlap scanners on rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tierer-server
    spec:
      terminationGracePeriodSeconds: 40
      tolerations:
        - key: cwm-iac-worker-role
          operator: Equal
          value: system
          effect: NoExecute
      containers:
        - name: tierer-server
          image: {{ .Values.cwmMinioTierer.tierer.image | quote }}
          imagePullPolicy: IfNotPresent
          resources: {{ .Values.tierer.resources | toYaml | nindent 12 }}
          ports:
            - name: tierer-metrics
              containerPort: 8081
          {{- if eq (.Values.tierer.probes_enabled | toString) "true" }}
          livenessProbe:
            httpGet: {path: /livez, port: tierer-metrics}
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: tierer-metrics}
            periodSeconds: 30
            timeoutSeconds: 10
          {{- end }}
          env:
            - {name: INSTANCE_ID, value: {{ .Values.tenant.tenant.name | quote }}}
            - {name: ACCESS_RETENTION, value: {{ .Values.tierer.access_retention | quote }}}
            {{- $settings := dict "mode" "MODE" "apply" "APPLY" "low_threshold" "LOW_THRESHOLD" "low_hours" "LOW_WINDOW_HOURS" "high_threshold" "HIGH_THRESHOLD" "high_hours" "HIGH_WINDOW_HOURS" "high_include_current" "HIGH_INCLUDE_CURRENT" "restore_days" "RESTORE_DAYS" "coverage_enabled" "COVERAGE_ENABLED" "coverage_template" "COVERAGE_TEMPLATE" "coverage_value" "COVERAGE_VALUE" "exclude_buckets" "EXCLUDE_BUCKETS" "exclude_bucket_prefixes" "EXCLUDE_BUCKET_PREFIXES" "chunk_size" "CHUNK_SIZE" "completion_delay" "COMPLETION_DELAY" "retry_delay" "RETRY_DELAY" }}
            {{- range $key, $suffix := $settings }}
            - name: TIERER_{{ $suffix }}
              value: {{ index $.Values.tierer $key | toString | quote }}
            {{- end }}
            {{- range $key := list "daily_transition_attempts" "daily_transition_bytes" "daily_restore_attempts" "daily_restore_bytes" }}
            {{- if ne (index $.Values.tierer $key | toString) "" }}
            - name: TIERER_{{ $key | upper }}
              value: {{ index $.Values.tierer $key | toString | quote }}
            {{- end }}
            {{- end }}
            - {name: TIERER_MARKER_KEY, value: cwm-tier}
            - {name: TIERER_MARKER_VALUE, value: low}
            - {name: TIERER_LISTEN_ADDR, value: ":8081"}
            - {name: REDIS_ADDR, value: "tierer-redis:6379"}
            - {name: MINIO_ENDPOINT, value: "minio-tenant-primary:80"}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cwm-minio-api-tenant-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cwm-minio-api-tenant-creds
                  key: secretkey
            - {name: MINIO_SECURE, value: "false"}
