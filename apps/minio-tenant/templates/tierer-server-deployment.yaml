apiVersion: apps/v1
kind: Deployment
metadata:
  name: tierer-server
spec:
  selector:
    matchLabels:
      app: tierer-server
  replicas: 1
  template:
    metadata:
      labels:
        app: tierer-server
    spec:
      tolerations:
        - key: cwm-iac-worker-role
          operator: Equal
          value: system
          effect: NoExecute
      containers:
        - name: tierer-server
          image: {{ .Values.cwmMinioTierer.tierer.image | default "ghcr.io/cloudwebmanage/cwm-minio-tierer:aa0cbe581d39be5f88c12c57f3d6d9075beea454" | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: "INSTANCE_ID", value: {{ .Values.tenant.tenant.name| quote }}}
            - {name: "ACCESS_RETENTION", value: {{ .Values.tierer.access_retention | quote }}}
            # - {name: "LOG_LEVEL", value: "debug"}
            - {name: "TIERER_MODE", value: "apply"}  # `audit` or `apply`
            - {name: "TIERER_APPLY", value: "true"}  # Must be `true` in addition to `TIERER_MODE=apply`
            - {name: "TIERER_LOW_THRESHOLD", value: {{ .Values.tierer.low_threshold | quote }}}
            - {name: "TIERER_LOW_WINDOW_HOURS", value: {{ .Values.tierer.low_hours | quote }}}
            - {name: "TIERER_HIGH_THRESHOLD", value: {{ .Values.tierer.high_threshold | quote }}}
            - {name: "TIERER_HIGH_WINDOW_HOURS", value: {{ .Values.tierer.high_hours | quote }}}
            - {name: "TIERER_HIGH_INCLUDE_CURRENT", value: "true"}  # Include current hour in the high window only. |
            - {name: "TIERER_RESTORE_DAYS", value: "1"}  # Positive MinIO calendar-day restore value `E`. |
            - {name: "TIERER_COVERAGE_ENABLED", value: "false"}  # don't look for coverage records to check if hour data is complete.
            - {name: "TIERER_COVERAGE_TEMPLATE", value: ""}  # Hour-varying Go time-format key template. |
            - {name: "TIERER_COVERAGE_VALUE", value: ""}  # Exact non-empty complete value. |
            - {name: "TIERER_MARKER_KEY", value: "cwm-tier"}  # Reserved application tag key. |
            - {name: "TIERER_MARKER_VALUE", value: "low"}  # Required marker value and lifecycle filter value. |
            - {name: "REDIS_ADDR", value: "tierer-redis:6379"}  # Standalone Redis `host:port`. |
            - {name: "MINIO_ENDPOINT", value: "minio-tenant-primary:80"}  # MinIO `host:port`, without URL scheme. |
            - name: "MINIO_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: cwm-minio-api-tenant-creds
                  key: accesskey
            - name: "MINIO_SECRET_KEY"
              valueFrom:
                secretKeyRef:
                  name: cwm-minio-api-tenant-creds
                  key: secretkey
            - {name: "MINIO_SECURE", value: "false"}  # Use HTTPS when true. |
#            - {name: "MINIO_REGION` | empty | Optional MinIO region. |
#            - {name: "MINIO_OPERATION_TIMEOUT` | `30s` | Per-operation timeout and listing inactivity timeout. |
#            - {name: "TIERER_DAILY_TRANSITION_ATTEMPTS", value: ""}  # Positive UTC daily marker-attempt limit. |
#            - {name: "TIERER_DAILY_TRANSITION_BYTES", value: ""}  # Positive UTC daily bytes represented by marker attempts. |
#            - {name: "TIERER_DAILY_RESTORE_ATTEMPTS", value: ""}  # Positive UTC daily initial/renewal restore-attempt limit. |
#            - {name: "TIERER_DAILY_RESTORE_BYTES", value: ""}  # Positive UTC daily bytes for initial restores; renewals charge zero bytes. |
#            - {name: "TIERER_EXCLUDE_BUCKETS", value: ""}  # Exact comma-separated names; no blanks/whitespace/duplicates. |
#            - {name: "TIERER_EXCLUDE_BUCKET_PREFIXES", value: ""}  # Exact comma-separated prefixes with the same syntax. |
            - {name: "TIERER_CHUNK_SIZE", value: {{ .Values.tierer.chunk_size | quote }}}  # Objects per work chunk; `chunk*(low+high)` may not exceed 10,000 Redis access keys. |
#            - {name: "TIERER_COMPLETION_DELAY", value: "5m"}  # Delay after durable cursor reset at full traversal completion. |
#            - {name: "TIERER_RETRY_DELAY", value: "30s"}  # Delay after fatal scan failure; resumes from durable cursor. |
#            - {name: "TIERER_LISTEN_ADDR", value: ":8081"}  # Health/metrics listen address. |
#            - {name: "TIERER_SHUTDOWN_TIMEOUT", value: "30s"}  # Whole-service shutdown deadline. |
