apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cdn-edge-coredns
  labels:
    app: cdn-edge-coredns
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: cdn-edge-coredns
  template:
    metadata:
      labels:
        app: cdn-edge-coredns
    spec:
      nodeSelector:
        cwm-iac-worker-role: cdn
      tolerations:
        - key: "cwm-iac-worker-role"
          operator: "Equal"
          value: "cdn"
          effect: "NoExecute"
      volumes:
        - name: coredns-conf
          configMap:
            name: cdn-edge
            items:
              - key: Corefile
                path: Corefile
        - name: data
          hostPath:
            path: /var/lib/cwm/cdn-edge-data
      hostNetwork: true
      containers:
        - name: coredns
          # Pulled Sep 9, 2025
          image: "coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26"
          args: ["-conf", "/etc/coredns/Corefile"]
          volumeMounts:
            - name: coredns-conf
              mountPath: /etc/coredns
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              port: 8181
              path: /health
