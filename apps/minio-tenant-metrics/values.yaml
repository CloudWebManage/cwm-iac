vmagent:
  enabled: true
  # Existing callers supply remoteWrite. Omit it for standalone/offline renders.
  remoteWrite: {}

prometheus:
  server:
    tolerations:
      - key: "cwm-iac-worker-role"
        operator: "Equal"
        value: "system"
        effect: "NoExecute"

    persistentVolume:
      storageClass: longhorn
      size: 50Gi

    retention: "2d"

  serverFiles:
    prometheus.yml:
      scrape_configs:
        - job_name: minio-tenant-main-bucket-api
          metrics_path: /bucket/api
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_cwm_minio_tenant]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_number]
              action: keep
              regex: "minio;9000"
            - source_labels: [__meta_kubernetes_pod_ip]
              action: replace
              target_label: __address__
              replacement: $1:9000

  alertmanager:
    enabled: false

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false
