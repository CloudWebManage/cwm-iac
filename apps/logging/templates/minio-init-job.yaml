apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
    template:
      spec:
        restartPolicy: OnFailure
        tolerations:
          - key: cwm-iac-worker-role
            operator: Equal
            value: system
            effect: NoExecute
        volumes:
          - name: tenant-env-configuration
            secret:
              secretName: tenant-env-configuration
        containers:
          - name: minio-init
            image: docker.io/pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
            volumeMounts:
              - name: tenant-env-configuration
                mountPath: /etc/tenant-env-configuration
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                source /etc/tenant-env-configuration/config.env
                mc alias set l http://minio.logging.svc.cluster.local "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                mc mb --ignore-existing l/loki-chunks l/loki-ruler l/loki-admin
